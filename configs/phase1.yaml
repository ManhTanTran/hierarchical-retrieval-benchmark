project_name: dapr-hhr-phase1
seed: 42

retrieval:
  document_top_k: 20
  passage_top_k: 100
  fusion: rrf
  rrf_k: 60
  dense_backend: sentence_transformers
  dense_model: intfloat/e5-small-v2
  dense_model_revision: ffb93f3bd4047442299a41ebb6fa998a38507c52
  dense_batch_size: 64
  multi_process_chunk_size: 5000
  embedding_write_chunk_size: 50000
  embedding_checkpoint_rows: 50000
  dense_search_chunk_size: 50000
  preferred_devices: ["cuda:0", "cuda:1"]
  enable_multi_gpu: true
  enable_resume: true
  embedding_dtype: float32
  preflight_sample_size: 0
  preflight_timeout_threshold_hours: 10.0
  strict_preflight: false
  progress_interval: 50000
  dense_query_prefix: "query: "
  dense_corpus_prefix: "passage: "

evaluation:
  ndcg_k: 10
  recall_k: 100

run:
  mode: smoke
  smoke_experiments:
    - sparse__sparse
    - sparse__dense
    - dense__dense
    - combined__combined
  baseline_experiments:
    - sparse__dense
    - dense__dense
    - combined__dense
    - combined__combined
